{% extends "base.html" %}

{% block content %}
<div class="min-h-[60vh] flex flex-col items-center justify-center p-6 text-center">
    <h1 class="text-9xl font-aggressive text-primary/20 absolute select-none pointer-events-none blur-sm animate-pulse">403</h1>
    <h1 class="text-6xl font-aggressive text-white relative z-10 mb-4 uppercase tracking-widest">{% trans %}Forbidden{% endtrans %}</h1>
    <div class="h-1 w-32 bg-primary mb-8 relative z-10"></div>
    <h2 class="text-2xl font-mono text-stone-400 relative z-10">{% trans %}You are not welcome here.{% endtrans %}</h2>
    <a href="{{ url_for('views.static_html', route='/') }}" class="mt-12 px-8 py-3 bg-stone-900 border border-stone-700 text-stone-300 font-bold uppercase tracking-widest hover:border-primary hover:text-white transition-all duration-300 relative z-10">Return to Safety</a>
</div>
{% endblock %}
