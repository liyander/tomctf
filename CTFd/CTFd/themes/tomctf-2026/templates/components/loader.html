<style>
  #tom-global-loader {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 99999;
    background: rgba(12, 12, 16, 0.5);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 1;
    transition: opacity 0.5s ease-out, visibility 0.5s ease-out;
  }
  
  #tom-global-loader.hidden {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .tom-loader-spinner {
    width: 50px;
    height: 50px;
    border: 3px solid rgba(255, 255, 255, 0.1);
    border-radius: 50%;
    border-top-color: rgba(227, 35, 35, 0.9);
    animation: tomLoaderSpin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
    box-shadow: 0 0 20px rgba(227, 35, 35, 0.4);
  }

  @keyframes tomLoaderSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>

<div id="tom-global-loader">
  <div class="tom-loader-spinner"></div>
</div>

<script>
  (() => {
    const loader = document.getElementById('tom-global-loader');
    if (!loader) return;

    let skipNextUnload = false;
    let recoveryTimer;

    const hideLoader = () => {
      window.clearTimeout(recoveryTimer);
      loader.classList.add('hidden');
    };

    const showLoader = () => {
      loader.classList.remove('hidden');
      // Attachment responses and cancelled navigations do not produce a new
      // page load. Never leave the current page trapped behind the overlay.
      window.clearTimeout(recoveryTimer);
      recoveryTimer = window.setTimeout(hideLoader, 8000);
    };

    document.addEventListener('click', (event) => {
      const link = event.target.closest('a[href]');
      if (!link) return;

      const href = link.getAttribute('href') || '';
      skipNextUnload = Boolean(
        link.dataset.noLoader !== undefined ||
        link.hasAttribute('download') ||
        link.target === '_blank' ||
        /(^|\/)files\//i.test(href)
      );

      if (skipNextUnload) {
        // Some browsers dispatch beforeunload before the click stack clears.
        window.setTimeout(() => { skipNextUnload = false; }, 1500);
      }
    }, true);

    window.addEventListener('load', () => window.setTimeout(hideLoader, 100));
    window.addEventListener('pageshow', hideLoader);
    window.addEventListener('focus', () => {
      if (document.visibilityState === 'visible') hideLoader();
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') hideLoader();
    });

    window.addEventListener('beforeunload', () => {
      if (!skipNextUnload) showLoader();
    });

    window.setTimeout(hideLoader, 4000);
  })();
</script>
