{% extends "admin/base.html" %}

{% block content %}
<div class="jumbotron">
  <div class="container">
    <h1>Add CVE</h1>
    <p>Create a new CVE lab entry.</p>
  </div>
</div>

<div class="container">
  {% if docker_images_error %}
  <div class="alert alert-warning">{{ docker_images_error }}</div>
  {% endif %}

  <div class="card">
    <div class="card-body">
      {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
      {% endif %}

      <form method="POST">
        <input type="hidden" name="nonce" value="{{ Session.nonce }}">
        <div class="form-group">
          <label>Title</label>
          <input type="text" class="form-control" name="title" required>
        </div>
        <div class="form-group">
          <label>Slug (optional)</label>
          <input type="text" class="form-control" name="slug">
        </div>
        <div class="form-group">
          <label>CVE ID</label>
          <input type="text" class="form-control" name="cve_id" placeholder="CVE-2021-44228">
        </div>
        <div class="form-row">
          <div class="form-group col-md-4">
            <label>Severity</label>
            <select class="form-control custom-select" name="severity">
              {% for option in severity_options %}
                <option value="{{ option }}" {% if option == 'Medium' %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-4">
            <label>Category</label>
            <input type="text" class="form-control" name="category" value="Web">
          </div>
          <div class="form-group col-md-4">
            <label>CVSS</label>
            <input type="number" step="0.1" min="0" max="10" class="form-control" name="cvss" value="0">
          </div>
        </div>
        <div class="form-group">
          <label>Release Date</label>
          <input type="text" class="form-control" name="release_date" placeholder="10 Dec 2021">
        </div>
        <div class="form-group">
          <label>Short Description</label>
          <textarea class="form-control" rows="2" name="short_description"></textarea>
        </div>
        <div class="form-group">
          <label>Description (Markdown)</label>
          <textarea class="form-control" rows="8" name="description"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group col-md-8">
            <label>Flag</label>
            <input type="text" class="form-control" name="flag">
          </div>
          <div class="form-group col-md-4">
            <label>Points</label>
            <input type="number" min="0" class="form-control" name="points" value="0">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group col-md-2">
            <label>Docker Enabled</label>
            <select class="form-control" name="docker_enabled">
              <option value="0" selected>Disabled</option>
              <option value="1">Enabled</option>
            </select>
          </div>
          <div class="form-group col-md-7">
            <label>Docker Image</label>
            <select class="form-control" name="docker_image">
              <option value="">Select Docker image tag</option>
              {% for image in docker_images %}
                <option value="{{ image }}">{{ image }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-3">
            <label>Timer Cap</label>
            <select class="form-control" name="docker_expiry">
              <option value="0" selected>Use Docker Global</option>
              <option value="1800">30 mins</option>
              <option value="3600">60 mins</option>
              <option value="7200">120 mins</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label>References (JSON array)</label>
          <textarea class="form-control" rows="4" name="references" placeholder='[{"title":"NVD","url":"https://..."}]'></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Create CVE</button>
        <a class="btn btn-light" href="{{ url_for('prolabs.cves_admin_list') }}">Cancel</a>
      </form>
    </div>
  </div>
</div>
{% endblock %}
