{% extends "admin/base.html" %}

{% block content %}
<div class="jumbotron">
  <div class="container">
    <h1>Add Adversary Operation</h1>
    <p>Create a new adversary operation entry.</p>
  </div>
</div>

<div class="container pb-5">
  {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
  {% endif %}

  {% if docker_images_error %}
    <div class="alert alert-warning">{{ docker_images_error }}</div>
  {% endif %}

  <form method="POST">
    <input type="hidden" name="nonce" value="{{ Session.nonce }}">

    <div class="card">
      <div class="card-body">
        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Title</label>
            <input class="form-control" name="title" required>
          </div>
          <div class="form-group col-md-6">
            <label>Slug (optional)</label>
            <input class="form-control" name="slug" placeholder="auto-generated-from-title">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-4">
            <label>Difficulty</label>
            <select class="form-control custom-select" name="difficulty">
              {% for option in difficulty_options %}
                <option value="{{ option }}" {% if option == 'Medium' %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-4">
            <label>Category</label>
            <input class="form-control" name="category" value="Adversary Operations">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-6">
            <label>Cover Image URL</label>
            <input class="form-control" name="cover_image" placeholder="https://...">
          </div>
          <div class="form-group col-md-6">
            <label>Logo Image URL</label>
            <input class="form-control" name="logo_image" placeholder="https://...">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group col-md-2">
            <label>Docker Enabled</label>
            <select class="form-control" name="docker_enabled">
              <option value="0" selected>Disabled</option>
              <option value="1">Enabled</option>
            </select>
          </div>
          <div class="form-group col-md-7">
            <label>Docker Image</label>
            <select class="form-control" name="docker_image">
              <option value="">Select Docker image tag</option>
              {% for image in docker_images %}
                <option value="{{ image }}">{{ image }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="form-group col-md-3">
            <label>Timer Cap</label>
            <select class="form-control" name="docker_expiry">
              <option value="0" selected>Use Docker Global</option>
              <option value="1800">30 mins</option>
              <option value="3600">60 mins</option>
              <option value="7200">120 mins</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-3 d-flex gap-2">
      <button type="submit" class="btn btn-primary">Create Operation</button>
      <a class="btn btn-outline-secondary" href="{{ url_for('prolabs.adversary_operations_admin_list') }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
