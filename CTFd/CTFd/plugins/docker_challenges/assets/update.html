{% extends "admin/challenges/update.html" %}
{% block category %}
<div class="form-group">
    <label>
        Category<br>
        <small class="form-text text-muted">Challenge Category</small>
    </label>
    <input type="text" class="form-control chal-category" name="category" value="{{ challenge.category }}">
</div>
<div class="form-group">
    <label for="DockerImage" id='dockerimage_label'>Docker Image:
        <i class="far fa-question-circle text-muted cursor-help" data-toggle="tooltip" data-placement="right" title="The docker image for your challenge"></i>
    </label>
    <select id="dockerimage_select" name="docker_image" class="form-control" required></select>
</div>
<div class="form-group">
    <label for="container_expiry">Instance Duration:
        <small class="form-text text-muted">Maximum time a player's container can run</small>
    </label>
    <select name="container_expiry" id="container_expiry" class="form-control">
        <option value="300" {% if challenge.container_expiry == 300 %}selected{% endif %}>5 Minutes</option>
        <option value="600" {% if challenge.container_expiry == 600 %}selected{% endif %}>10 Minutes</option>
        <option value="1200" {% if challenge.container_expiry == 1200 or not challenge.container_expiry %}selected{% endif %}>20 Minutes</option>
        <option value="1800" {% if challenge.container_expiry == 1800 %}selected{% endif %}>30 Minutes</option>
        <option value="3600" {% if challenge.container_expiry == 3600 %}selected{% endif %}>60 Minutes</option>
    </select>
</div>
<div class="form-group">
    <label for="access_mode">Access Mode:
        <small class="form-text text-muted">Choose how players interact with this Docker challenge</small>
    </label>
    <select name="access_mode" id="access_mode" class="form-control">
        <option value="web_proxy" {% if challenge.access_mode == 'web_proxy' or not challenge.access_mode %}selected{% endif %}>Web Proxy - protected browser URL</option>
        <option value="terminal" {% if challenge.access_mode == 'terminal' %}selected{% endif %}>Terminal / AttackBox - browser terminal into the container</option>
        <option value="direct" {% if challenge.access_mode == 'direct' %}selected{% endif %}>Direct Host Port - show host:port</option>
    </select>
</div>
<div class="form-group" id="terminal-shell-group">
    <label for="terminal_shell">Terminal Shell:
        <small class="form-text text-muted">Shell used for terminal commands inside the container</small>
    </label>
    <input type="text" class="form-control" name="terminal_shell" id="terminal_shell" value="{{ challenge.terminal_shell or '/bin/sh' }}" placeholder="/bin/sh">
</div>
{% endblock %}
{% block footer %}
<script>
var DOCKER_IMAGE = '{{ challenge.docker_image }}';
</script>
{% endblock %}
